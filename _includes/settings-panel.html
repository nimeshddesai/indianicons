<!-- _includes/settings-panel.html
     Gear-icon settings panel: font-size stepper + dark-mode toggle.
     Wired by assets/js/settings.js (loaded in default.html).
     Identical in structure to the heroes course panel so one JS module
     drives both. -->
<div class="settings-wrap">
  <button class="settings-trigger"
          id="settingsToggle"
          aria-label="Display settings"
          aria-expanded="false"
          aria-controls="settingsPanel">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <div class="settings-panel" id="settingsPanel"
       role="dialog" aria-label="Display settings" hidden>
    <p class="settings-label">Text size</p>
    <div class="font-size-row">
      <button class="settings-btn" id="fontDecrease" aria-label="Decrease text size">A−</button>
      <span class="font-size-val" id="fontSizeVal" aria-live="polite"></span>
      <button class="settings-btn" id="fontIncrease" aria-label="Increase text size">A+</button>
    </div>
    <hr class="settings-divider" aria-hidden="true">
    <button class="settings-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <span id="themeIcon">🌙</span>
      <span class="theme-label">Dark mode</span>
    </button>
  </div>
</div>
